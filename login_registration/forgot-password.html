<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Antigravity Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="index.html">
                <i class="bi bi-layers-fill fs-3"></i>
                AntiAuth
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#features">Features</a>
                    </li>
                    <li class="nav-item ms-lg-3 me-lg-3 me-3">
                        <a class="btn btn-outline-primary px-4 mb-2 mb-lg-0 w-100" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary px-4 w-100" href="register.html">Sign Up</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card auth-card border-0 shadow-lg rounded-4 overflow-hidden fade-in-up">
                        <div class="card-body p-4 p-sm-5">
                            <div class="text-center mb-4">
                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-3">
                                    <i class="bi bi-key fs-1"></i>
                                </div>
                                <h2 class="fw-bold text-dark">Forgot Password?</h2>
                                <p class="text-muted">No worries, we'll send you reset instructions.</p>
                            </div>

                            <form id="forgotPasswordForm" novalidate>
                                <!-- Alert for general form errors -->
                                <div id="forgotAlert" class="alert d-none" role="alert"></div>

                                <div class="mb-4 position-relative">
                                    <label for="forgotEmail" class="form-label fw-medium text-dark">Email Address</label>
                                    <div class="input-group has-validation">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control border-start-0 ps-0 focus-ring-none" id="forgotEmail" placeholder="name@example.com" required>
                                        <div class="invalid-feedback">
                                            Please enter a valid email address.
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 py-sm-3 fw-semibold shadow-sm mb-4 btn-hover-elevate">
                                    Reset Password
                                </button>
                                
                                <div class="text-center">
                                    <a href="login.html" class="text-muted text-decoration-none fw-semibold">
                                        <i class="bi bi-arrow-left me-1"></i> Back to login
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-4 mt-auto">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2026 AntiAuth Project. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const forgotEmail = document.getElementById('forgotEmail');
        let isEmailValidDB = false;
        let checkTimeout = null;
        
        forgotEmail.addEventListener('input', function() {
            clearTimeout(checkTimeout);
            const email = this.value;
            
            if (email.length > 5 && this.checkValidity()) {
                checkTimeout = setTimeout(() => {
                    fetch('php/check-user.php?email=' + encodeURIComponent(email))
                    .then(res => res.json())
                    .then(data => {
                        if (!data.exists) {
                            forgotEmail.setCustomValidity("Email not found in database.");
                            isEmailValidDB = false;
                        } else {
                            forgotEmail.setCustomValidity("");
                            isEmailValidDB = true;
                        }
                    });
                }, 500);
            }
        });

        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let isValid = this.checkValidity() && isEmailValidDB;
            this.classList.add('was-validated');
            
            if (isValid) {
                const btn = this.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Sending...';
                
                setTimeout(() => {
                    const alert = document.getElementById('forgotAlert');
                    alert.className = 'alert alert-success alert-dismissible fade show';
                    alert.innerHTML = 'A confirmation email has been sent.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Redirecting...';
                    
                    localStorage.setItem('resetEmail', forgotEmail.value);
                    
                    setTimeout(() => {
                        window.location.href = 'reset-password.html';
                    }, 1500);
                }, 1000);
            }
        });
    </script>
    <script src="js/session.js"></script>
</body>
</html>
