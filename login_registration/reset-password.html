<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Antigravity Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="index.html">
                <i class="bi bi-layers-fill fs-3"></i>
                AntiAuth
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#features">Features</a>
                    </li>
                    <li class="nav-item ms-lg-3 me-lg-3 me-3">
                        <a class="btn btn-outline-primary px-4 mb-2 mb-lg-0 w-100" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary px-4 w-100" href="register.html">Sign Up</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 col-xl-5">
                    <div class="card auth-card border-0 shadow-lg rounded-4 overflow-hidden fade-in-up">
                        <div class="card-body p-4 p-sm-5">
                            <div class="text-center mb-4">
                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-3">
                                    <i class="bi bi-shield-lock fs-1"></i>
                                </div>
                                <h2 class="fw-bold text-dark">Reset Password</h2>
                                <p class="text-muted">Enter your new password below.</p>
                            </div>

                            <form id="resetPasswordForm" novalidate>
                                <div id="resetAlert" class="alert d-none" role="alert"></div>

                                <div class="mb-4 position-relative">
                                    <label for="newPassword" class="form-label fw-medium text-dark">New Password</label>
                                    <div class="input-group has-validation">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control border-start-0 border-end-0 px-0 focus-ring-none" id="newPassword" placeholder="New Password" required minlength="8">
                                        <button class="btn btn-outline-secondary bg-white border-start-0 border text-muted toggle-password" type="button" data-target="newPassword" aria-label="Toggle password visibility">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                        <div class="invalid-feedback">
                                            Password must be at least 8 characters.
                                        </div>
                                    </div>
                                    
                                    <div id="capsLockWarning-newPassword" class="form-text text-warning d-none mt-1 fw-bold small">
                                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Caps Lock is ON
                                    </div>
                                    
                                    <!-- Password Strength Indicator -->
                                    <div class="mt-2" id="passwordStrengthContainer" style="display: none;">
                                        <div class="progress" style="height: 4px;">
                                            <div id="passwordStrengthBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                                        </div>
                                        <small id="passwordStrengthText" class="text-muted mt-1 d-block text-end" style="font-size: 0.75rem;"></small>
                                    </div>
                                </div>

                                <div class="mb-4 position-relative">
                                    <label for="confirmNewPassword" class="form-label fw-medium text-dark">Confirm New Password</label>
                                    <div class="input-group has-validation">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                                        <input type="password" class="form-control border-start-0 border-end-0 px-0 focus-ring-none" id="confirmNewPassword" placeholder="Confirm New Password" required minlength="8">
                                        <button class="btn btn-outline-secondary bg-white border-start-0 border text-muted toggle-password" type="button" data-target="confirmNewPassword" aria-label="Toggle password visibility">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                        <div class="invalid-feedback">
                                            Passwords do not match.
                                        </div>
                                    </div>
                                    <div id="capsLockWarning-confirmNewPassword" class="form-text text-warning d-none mt-1 fw-bold small">
                                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Caps Lock is ON
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 py-sm-3 fw-semibold shadow-sm mb-4 btn-hover-elevate">
                                    Save New Password
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-4 mt-auto">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2026 AntiAuth Project. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const passInput = document.getElementById('newPassword');
        const confirmPassInput = document.getElementById('confirmNewPassword');
        const form = document.getElementById('resetPasswordForm');
        
        const strengthBar = document.getElementById('passwordStrengthBar');
        const strengthText = document.getElementById('passwordStrengthText');
        const strengthContainer = document.getElementById('passwordStrengthContainer');
        
        const checkMatch = () => {
            if (confirmPassInput.value !== passInput.value && confirmPassInput.value !== "") {
                confirmPassInput.setCustomValidity("Passwords don't match");
            } else {
                confirmPassInput.setCustomValidity('');
            }
        };

        const checkStrength = () => {
            const val = passInput.value;
            if (val.length > 0) {
                strengthContainer.style.display = 'block';
                let strength = 0;
                let text = '';
                let colorClass = '';
                
                if (val.length >= 8) strength += 25;
                if (val.match(/[a-z]+/)) strength += 25;
                if (val.match(/[A-Z]+/)) strength += 25;
                if (val.match(/[0-9]+/)) strength += 25;
                if (val.match(/[$@#&!]+/)) strength += 25;
                
                strength = Math.min(100, strength);
                
                if (strength <= 25) { text = 'Weak'; colorClass = 'bg-danger'; }
                else if (strength <= 50) { text = 'Fair'; colorClass = 'bg-warning'; }
                else if (strength <= 75) { text = 'Good'; colorClass = 'bg-info'; }
                else { text = 'Strong'; colorClass = 'bg-success'; }
                
                strengthBar.style.width = strength + '%';
                strengthBar.className = 'progress-bar ' + colorClass;
                strengthText.textContent = text;
            } else {
                strengthContainer.style.display = 'none';
            }
        };

        passInput.addEventListener('input', () => {
            checkMatch();
            checkStrength();
        });
        confirmPassInput.addEventListener('input', checkMatch);

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            checkMatch(); // Re-validate on submit
            
            let isValid = this.checkValidity();
            this.classList.add('was-validated');
            
            if (isValid) {
                const email = localStorage.getItem('resetEmail');
                const btn = this.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                
                if (!email) {
                    const alert = document.getElementById('resetAlert');
                    alert.className = 'alert alert-danger alert-dismissible fade show';
                    alert.innerHTML = 'Error: Email not found. Please restart the forgot password process.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
                    return;
                }
                
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Saving...';
                
                fetch('php/update-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: passInput.value })
                })
                .then(res => res.json())
                .then(data => {
                    const alert = document.getElementById('resetAlert');
                    if (data.success) {
                        alert.className = 'alert alert-success alert-dismissible fade show';
                        alert.innerHTML = 'Password successfully changed! Redirecting to login...';
                        localStorage.removeItem('resetEmail');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1500);
                    } else {
                        alert.className = 'alert alert-danger alert-dismissible fade show';
                        alert.innerHTML = (data.message || 'Error occurred.') + '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    }
                })
                .catch(err => {
                    const alert = document.getElementById('resetAlert');
                    alert.className = 'alert alert-danger alert-dismissible fade show';
                    alert.innerHTML = 'Network error. Please try again.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                });
            }
        });
    </script>
    <script src="js/session.js"></script>
</body>
</html>
